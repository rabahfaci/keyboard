# TEMPORARY: standalone test build for bring-up of the right half alone.
# The right half is normally a BLE split peripheral (see Kconfig.defconfig)
# and sends no USB HID output by itself. Forcing non-split mode lets it
# act as a standalone USB keyboard so every switch can be verified with
# the HTML key tester before the left half + final split pairing exist.
#
# REVERT before building the final split firmware (both halves):
#   git checkout -- boards/shields/temper/temper_right.conf
CONFIG_ZMK_SPLIT=n

# TEMPORARY: raw matrix-scan debug over USB serial (CDC ACM), bypassing
# USB HID entirely. Lets us verify the physical switch matrix directly
# without depending on macOS recognizing it as a keyboard.
CONFIG_ZMK_USB_LOGGING=y
